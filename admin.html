<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | قرارگاه رسانه‌ای</title><style>@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#07111b;color:#eef4f8;font-family:Vazirmatn,Tahoma;line-height:1.8}.wrap{max-width:1050px;margin:auto;padding:24px 15px}.box{background:#0d1b29;border:1px solid #284258;border-radius:18px;padding:22px;margin:16px 0}h1,h2{margin-top:0}label{display:block;margin:12px 0 6px}input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid #38536a;background:#07111b;color:#fff;font:inherit}textarea{min-height:120px;resize:vertical}.btn{border:0;border-radius:10px;padding:10px 16px;background:#d8b85d;color:#111;font-weight:800;cursor:pointer;margin:7px 4px 0 0}.danger{background:#c94c4c;color:white}.secondary{background:#24445d;color:white}.muted{color:#9eafbd;font-size:13px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{border:1px solid #294256;border-radius:14px;padding:15px;margin:12px 0}.item img,.item video{max-width:300px;max-height:190px;display:block;margin-top:10px;border-radius:8px;background:#000}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{padding:4px 9px;border-radius:999px;background:#16324a;font-size:12px}.on{background:#164b36}.off{background:#4a2d2d}a{color:#9fd3ff}.msg{padding:10px;border-radius:10px;margin-top:10px;background:#102437;color:#c7d8e6}.error{background:#482525;color:#ffd1d1}.preview{max-width:260px;max-height:180px;border-radius:10px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.item img,.item video{max-width:100%}}</style></head><body><div class="wrap">
<div id="login" class="box"><h1>ورود مدیر</h1><p class="muted">برای مدیریت اخبار و رسانه‌ها با ایمیل مدیر و رمز عبور وارد شوید.</p><label>ایمیل مدیر</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور"><button class="btn" id="loginBtn">ورود</button><div id="loginMsg"></div></div>
<div id="app" class="hidden"><div class="box"><div class="row" style="justify-content:space-between"><div><h1>پنل مدیریت محتوا</h1><p class="muted">مدیریت دائمی اطلاعیه‌ها، عکس‌ها و ویدئوها</p></div><div><a class="btn secondary" href="index.html">مشاهده سایت</a><button class="btn danger" id="logoutBtn">خروج</button></div></div></div>
<div class="box"><h2 id="formTitle">افزودن اطلاعیه</h2><div class="grid"><div><label>عنوان</label><input id="title" placeholder="مثلاً اطلاعیه برنامه هفته آینده"></div><div><label>دسته‌بندی</label><select id="category"><option>اطلاعیه</option><option>خبر</option><option>گزارش</option><option>برنامه</option></select></div></div><label>متن</label><textarea id="body" placeholder="متن اطلاعیه یا خبر..."></textarea><label>عکس یا ویدئو (اختیاری)</label><input id="media" type="file" accept="image/*,video/mp4,video/webm,video/ogg"><div id="oldMedia"></div><label><input id="published" type="checkbox" checked style="width:auto"> انتشار در سایت</label><button class="btn" id="saveBtn">ثبت اطلاعیه</button><button class="btn secondary hidden" id="cancelBtn">لغو ویرایش</button><div id="formMsg"></div></div>
<div class="box"><h2>مطالب ثبت‌شده</h2><div id="list"><p class="muted">در حال دریافت...</p></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
let client,editing=null,currentPosts=[];
const $=id=>document.getElementById(id);function msg(el,text,error=false){el.innerHTML=text?`<div class="msg ${error?'error':''}">${text}</div>`:''}
function configured(){return window.SUPABASE_CONFIG&&!SUPABASE_CONFIG.url.includes('YOUR-PROJECT')&&!SUPABASE_CONFIG.anonKey.includes('YOUR_')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function boot(){if(!configured()){msg($('loginMsg'),'ابتدا config.js را با URL و anon key پروژه Supabase تنظیم کنید.',true);$('loginBtn').disabled=true;return}client=supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey);const {data:{session}}=await client.auth.getSession();if(session){showApp()}else{showLogin()}client.auth.onAuthStateChange((_e,s)=>s?showApp():showLogin())}
function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden')}async function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadPosts()}
$('loginBtn').onclick=async()=>{msg($('loginMsg'),'');const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg($('loginMsg'),'ورود ناموفق بود. ایمیل، رمز و ثبت کاربر مدیر را بررسی کنید.',true)};
$('logoutBtn').onclick=()=>client.auth.signOut();
async function loadPosts(){const {data,error}=await client.from('posts').select('*').order('created_at',{ascending:false});if(error){msg($('list'),'خطا در دریافت مطالب: '+esc(error.message),true);return}currentPosts=data||[];render()}
function render(){if(!currentPosts.length){$('list').innerHTML='<p class="muted">هنوز مطلبی ثبت نشده است.</p>';return}$('list').innerHTML=currentPosts.map(p=>`<div class="item"><div class="row"><span class="pill">${esc(p.category)}</span><span class="pill ${p.published?'on':'off'}">${p.published?'منتشر شده':'مخفی'}</span><span class="muted">${new Date(p.created_at).toLocaleDateString('fa-IR')}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.body).replace(/\n/g,'<br>')}</p>${p.media_url?(p.media_type==='video'?`<video controls src="${esc(p.media_url)}"></video>`:`<img src="${esc(p.media_url)}" alt="">`):''}<div class="row"><button class="btn" onclick="editPost(${p.id})">ویرایش</button><button class="btn secondary" onclick="togglePublish(${p.id},${p.published})">${p.published?'مخفی کردن':'انتشار'}</button><button class="btn danger" onclick="deletePost(${p.id})">حذف</button></div></div>`).join('')}
function editPost(id){const p=currentPosts.find(x=>x.id===id);if(!p)return;editing=p.id;$('formTitle').textContent='ویرایش اطلاعیه';$('title').value=p.title;$('category').value=p.category;$('body').value=p.body;$('published').checked=p.published;$('oldMedia').innerHTML=p.media_url?`<p class="muted">رسانه فعلی:</p>${p.media_type==='video'?`<video class="preview" controls src="${esc(p.media_url)}"></video>`:`<img class="preview" src="${esc(p.media_url)}">`}`:'';$('cancelBtn').classList.remove('hidden');$('saveBtn').textContent='ذخیره تغییرات';window.scrollTo({top:0,behavior:'smooth'})}
$('cancelBtn').onclick=resetForm;
function resetForm(){editing=null;$('formTitle').textContent='افزودن اطلاعیه';$('title').value='';$('body').value='';$('category').value='اطلاعیه';$('media').value='';$('published').checked=true;$('oldMedia').innerHTML='';$('cancelBtn').classList.add('hidden');$('saveBtn').textContent='ثبت اطلاعیه';msg($('formMsg'),'')}
async function upload(file){if(!file)return null;if(file.size>100*1024*1024)throw new Error('حجم فایل بیشتر از ۱۰۰ مگابایت است.');const ext=(file.name.split('.').pop()||'bin').toLowerCase();const path=`${crypto.randomUUID()}.${ext}`;const {error}=await client.storage.from('media').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;const {data}=client.storage.from('media').getPublicUrl(path);return {url:data.publicUrl,type:file.type.startsWith('video/')?'video':'image',path}}
$('saveBtn').onclick=async()=>{try{$('saveBtn').disabled=true;msg($('formMsg'),'در حال ذخیره...');const title=$('title').value.trim(),body=$('body').value.trim(),file=$('media').files[0];if(!title||!body)throw new Error('عنوان و متن را وارد کنید.');let payload={title,category:$('category').value,body,published:$('published').checked,updated_at:new Date().toISOString()};if(file){const m=await upload(file);payload.media_url=m.url;payload.media_type=m.type}if(editing){const {error}=await client.from('posts').update(payload).eq('id',editing);if(error)throw error}else{const {error}=await client.from('posts').insert(payload);if(error)throw error}resetForm();await loadPosts();msg($('formMsg'),'با موفقیت ذخیره شد.')}catch(e){msg($('formMsg'),esc(e.message||'خطا در ذخیره'),true)}finally{$('saveBtn').disabled=false}};
async function togglePublish(id,state){const {error}=await client.from('posts').update({published:!state,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert('خطا: '+error.message);await loadPosts()}
async function deletePost(id){if(!confirm('این مطلب حذف شود؟'))return;const p=currentPosts.find(x=>x.id===id);const {error}=await client.from('posts').delete().eq('id',id);if(error){alert('خطا: '+error.message);return}if(p?.media_url){try{const marker='/storage/v1/object/public/media/';const i=p.media_url.indexOf(marker);if(i>=0)await client.storage.from('media').remove([p.media_url.slice(i+marker.length)])}catch(e){}}await loadPosts()}
boot();
</script></body></html>
